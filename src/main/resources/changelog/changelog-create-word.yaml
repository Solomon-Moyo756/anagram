databaseChangeLog:
  - changeSet:
      id: 1
      author: solomon
      changes:
        - createTable:
            tableName: words
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: value
                  type: VARCHAR(20)